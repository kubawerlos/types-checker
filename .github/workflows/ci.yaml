name: CI

on:
  - pull_request
  - push

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - run: composer update --no-progress
      - run: composer analyse

  test:
    name: PHP ${{ matrix.php-version }} ${{ matrix.description }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            description: 'with lowest dependencies'
            php-version: '7.2'
            composer_flags: '--prefer-lowest'
          - os: ubuntu-latest
            php-version: '7.2'
          - os: ubuntu-latest
            php-version: '7.3'
          - os: ubuntu-latest
            php-version: '7.4'
          - os: ubuntu-latest
            php-version: '8.0'
          - os: ubuntu-latest
            php-version: '8.1'
          - os: ubuntu-latest
            description: 'with calculating code coverage'
            php-version: '8.2'
            calculate-coverage: true
            phpunit-flags: '--coverage-clover=./build/logs/clover.xml'
          - os: macos-latest
            description: 'on macOS'
            php-version: '8.2'
          - os: windows-latest
            description: 'on Windows'
            php-version: '8.2'
          - os: ubuntu-latest
            php-version: '8.3'
          - os: ubuntu-latest
            php-version: '8.4'
          - os: ubuntu-latest
            php-version: '8.5'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: pcov.directory=${{ github.workspace }}/src
          coverage: ${{ (matrix.calculate-coverage && 'pcov') || 'none' }}

      - name: Install dependencies
        run: composer update --no-progress ${{ matrix.composer_flags }}

      - name: Run tests
        run: ./vendor/bin/phpunit ${{ matrix.phpunit-flags }}

      - name: Upload coverage results to Coveralls
        if: ${{ matrix.calculate-coverage }}
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer require --dev php-coveralls/php-coveralls --quiet
          ./vendor/bin/php-coveralls --verbose
